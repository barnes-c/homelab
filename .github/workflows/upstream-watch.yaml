---
name: Upstream watch
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/upstream-watch.sh
      - .github/workflows/upstream-watch.yaml

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check upstream state
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report changes on the tracking issue
        run: scripts/upstream-watch.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: "16"
