---
name: Renovate
on:
  pull_request:
    paths: &paths
      - .github/renovate.json
      - .github/workflows/renovate.yaml
  push:
    branches: [master]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: Renovate Config Validation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate config
        shell: bash
        env:
          RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.257.9@sha256:d6b65ff3562dd499240b23d34ef806ec7e5fd2675e4236a027dfb36774f2aa75
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint renovate-config-validator "$RENOVATE_IMAGE" --strict
