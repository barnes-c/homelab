immich:
  persistence:
    library:
      existingClaim: immich-library

controllers:
  main:
    containers:
      main:
        env:
          DB_HOSTNAME: immich-postgres
          DB_PORT: "5432"
          DB_DATABASE_NAME: immich
          IMMICH_CONFIG_FILE: /config/immich.json
        envFrom:
          - secretRef:
              name: immich-db
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi

persistence:
  immich-config:
    type: secret
    name: immich-config
    advancedMounts:
      main:
        main:
          - path: /config
            readOnly: true

machine-learning:
  enabled: false

valkey:
  enabled: true
  primary:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 256Mi
