apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprints
  namespace: authentik
stringData:
  sso.yaml: |
    version: 1
    metadata:
      name: SSO Applications

    entries:
      # Groups
      - model: authentik_core.group
        id: grafana-admins
        state: present
        identifiers:
          name: Grafana Admins

      - model: authentik_core.group
        id: grafana-editors
        state: present
        identifiers:
          name: Grafana Editors

      - model: authentik_core.group
        id: argocd-admins
        state: present
        identifiers:
          name: ArgoCD Admins

      # Grafana
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        state: present
        identifiers:
          name: Grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env GRAFANA_CLIENT_ID
          client_secret: !Env GRAFANA_CLIENT_SECRET
          redirect_uris:
            - url: "https://monitoring.barnes.biz/login/generic_oauth"
              matching_mode: "strict"
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        id: grafana-app
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://monitoring.barnes.biz

      # ArgoCD
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        state: present
        identifiers:
          name: ArgoCD
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env ARGOCD_CLIENT_ID
          client_secret: !Env ARGOCD_CLIENT_SECRET
          redirect_uris:
            - url: "https://argo.barnes.biz/api/dex/callback"
              matching_mode: "strict"
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        id: argocd-app
        state: present
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          meta_launch_url: https://argo.barnes.biz

      # Immich
      - model: authentik_providers_oauth2.oauth2provider
        id: immich-provider
        state: present
        identifiers:
          name: Immich
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env IMMICH_CLIENT_ID
          client_secret: !Env IMMICH_CLIENT_SECRET
          redirect_uris:
            - url: "https://img.barnes.biz/auth/login"
              matching_mode: "strict"
            - url: "app.immich:/"
              matching_mode: "strict"
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        id: immich-app
        state: present
        identifiers:
          slug: immich
        attrs:
          name: Immich
          provider: !KeyOf immich-provider
          meta_launch_url: https://immich.barnes.biz

      # Website Dashboard
      - model: authentik_providers_proxy.proxyprovider
        id: website-dashboard-provider
        state: present
        identifiers:
          name: Website Dashboard
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://barnes.biz

      - model: authentik_core.application
        id: website-dashboard-app
        state: present
        identifiers:
          slug: website-dashboard
        attrs:
          name: Website Dashboard
          provider: !KeyOf website-dashboard-provider
          meta_launch_url: https://barnes.biz/dashboard

      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        state: present
        attrs:
          providers:
            - !KeyOf website-dashboard-provider

  recovery.yaml: |
    version: 1
    metadata:
      name: Recovery with email verification
    entries:
      - identifiers:
          slug: default-recovery-flow
        id: flow
        model: authentik_flows.flow
        attrs:
          name: Default recovery flow
          title: Reset your password
          designation: recovery
          authentication: require_unauthenticated
      - identifiers:
          name: default-recovery-field-password
        id: prompt-field-password
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 0
          placeholder_expression: false
      - identifiers:
          name: default-recovery-field-password-repeat
        id: prompt-field-password-repeat
        model: authentik_stages_prompt.prompt
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          order: 1
          placeholder_expression: false
      - identifiers:
          name: default-recovery-skip-if-restored
        id: default-recovery-skip-if-restored
        model: authentik_policies_expression.expressionpolicy
        attrs:
          expression: |
            return bool(request.context.get('is_restored', True))
      - identifiers:
          name: default-recovery-email
        id: default-recovery-email
        model: authentik_stages_email.emailstage
        attrs:
          use_global_settings: true
          host: localhost
          port: 25
          username: ""
          use_tls: false
          use_ssl: false
          timeout: 10
          from_address: system@authentik.local
          token_expiry: minutes=30
          subject: authentik
          template: email/password_reset.html
          activate_user_on_success: true
          recovery_max_attempts: 5
          recovery_cache_timeout: minutes=5
      - identifiers:
          name: default-recovery-user-write
        id: default-recovery-user-write
        model: authentik_stages_user_write.userwritestage
        attrs:
          user_creation_mode: never_create
      - identifiers:
          name: default-recovery-identification
        id: default-recovery-identification
        model: authentik_stages_identification.identificationstage
        attrs:
          user_fields:
            - email
            - username
      - identifiers:
          name: default-recovery-user-login
        id: default-recovery-user-login
        model: authentik_stages_user_login.userloginstage
      - identifiers:
          name: Change your password
        id: stages-prompt-password
        model: authentik_stages_prompt.promptstage
        attrs:
          fields:
            - !KeyOf prompt-field-password
            - !KeyOf prompt-field-password-repeat
          validation_policies: []
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-identification
          order: 10
        model: authentik_flows.flowstagebinding
        id: flow-binding-identification
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-email
          order: 20
        model: authentik_flows.flowstagebinding
        id: flow-binding-email
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf stages-prompt-password
          order: 30
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-user-write
          order: 40
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          target: !KeyOf flow
          stage: !KeyOf default-recovery-user-login
          order: 100
        model: authentik_flows.flowstagebinding
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          policy_engine_mode: any
          invalid_response_action: retry
      - identifiers:
          policy: !KeyOf default-recovery-skip-if-restored
          target: !KeyOf flow-binding-identification
          order: 0
        model: authentik_policies.policybinding
        attrs:
          negate: false
          enabled: true
          timeout: 30
      - identifiers:
          policy: !KeyOf default-recovery-skip-if-restored
          target: !KeyOf flow-binding-email
          order: 0
        state: absent
        model: authentik_policies.policybinding
        attrs:
          negate: false
          enabled: true
          timeout: 30
      # The shipped example does not bind the flow to a brand, and that binding is what makes
      # recovery usable: ak create_recovery_key resolves the flow from the brand rather than by
      # designation. Kept in this same blueprint so !KeyOf resolves in one atomic import; as a
      # separate file it would have to !Find a flow that does not exist yet, which silently
      # yields null rather than erroring.
      - identifiers:
          domain: authentik-default
        model: authentik_brands.brand
        state: present
        attrs:
          flow_recovery: !KeyOf flow
