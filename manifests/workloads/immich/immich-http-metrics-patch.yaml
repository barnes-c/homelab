  http-route.interceptor.js: |
    import { Injectable } from '@nestjs/common';
    import { contextBase, core } from '@opentelemetry/sdk-node';
    export class HttpRouteInterceptor {
        intercept(context, next) {
            const rpcMetadata = core.getRPCMetadata(contextBase.context.active());
            if (rpcMetadata?.type === core.RPCType.HTTP) {
                rpcMetadata.route = context.switchToHttp().getRequest().route?.path;
            }
            return next.handle();
        }
    }
    Injectable()(HttpRouteInterceptor);
