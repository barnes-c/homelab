# On top of workloads-baseline: server, postgres and valkey talk to each other, and the
# server reaches Authentik for OIDC and iCloud for notification mail.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich
  namespace: immich
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - {}
    - toFQDNs:
        - matchName: auth.barnes.biz
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: smtp.mail.me.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-metrics
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
---
# Models are downloaded from Hugging Face on first use; downloads redirect to its CDN.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: machine-learning
  egress:
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "*.hf.co"
        - matchPattern: "*.xethub.hf.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
