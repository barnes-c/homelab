apiVersion: v1
kind: Service
metadata:
  name: immich-server-metrics
  namespace: immich
  annotations:
    prometheus.io/scrape: "true"
spec:
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: server
  ports:
    - name: metrics-api
      port: 8081
      targetPort: 8081
    - name: metrics-ms
      port: 8082
      targetPort: 8082
