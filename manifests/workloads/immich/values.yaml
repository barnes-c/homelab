immich:
  persistence:
    library:
      existingClaim: immich-library

# Top-level controllers/persistence are merged into every component (server, valkey, machine-learning),
# so server-only settings live under server:.
server:
  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME: immich-postgres
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            IMMICH_CONFIG_FILE: /config/immich.json
          envFrom:
            - secretRef:
                name: immich-db
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  persistence:
    immich-config:
      type: secret
      name: immich-config
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: true

machine-learning:
  enabled: false

valkey:
  enabled: true
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
