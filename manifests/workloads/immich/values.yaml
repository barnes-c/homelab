immich:
  persistence:
    library:
      existingClaim: immich-library

server:
  controllers:
    main:
      strategy: Recreate
      pod:
        # The library volume's only replica is on rpi5b-cp-01; elsewhere every read crosses the network.
        nodeSelector:
          kubernetes.io/hostname: rpi5b-cp-01
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            DB_HOSTNAME: immich-postgres
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            IMMICH_CONFIG_FILE: /config/immich.json
            IMMICH_TELEMETRY_INCLUDE: all
            IMMICH_LOG_FORMAT: json
            IMMICH_HELMET_FILE: "true"
          envFrom:
            - secretRef:
                name: immich-db
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi
  persistence:
    immich-config:
      type: secret
      name: immich-config
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: true
    # Trial of a patch restoring HTTP request metrics; v3.3.5 only. See barnes-c/homelab-issues#51.
    immich-http-metrics-patch:
      type: configMap
      name: immich-http-metrics-patch
      advancedMounts:
        main:
          main:
            - path: /usr/src/app/server/dist/repositories/telemetry.repository.js
              subPath: telemetry.repository.js
              readOnly: true
            - path: /usr/src/app/server/dist/app.module.js
              subPath: app.module.js
              readOnly: true
            - path: /usr/src/app/server/dist/middleware/http-route.interceptor.js
              subPath: http-route.interceptor.js
              readOnly: true

machine-learning:
  enabled: true
  controllers:
    main:
      pod:
        # On the control plane until a CM5 is labelled workload/ml=true. See barnes-c/homelab-issues#14.
        nodeSelector:
          kubernetes.io/hostname: rpi5b-cp-01
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            tag: v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
          env:
            ORT_DISABLE_TELEMETRY: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 8Gi

valkey:
  enabled: true
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
