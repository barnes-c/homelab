immich:
  persistence:
    library:
      existingClaim: immich-library

server:
  controllers:
    main:
      strategy: Recreate
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            DB_HOSTNAME: immich-postgres
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            IMMICH_CONFIG_FILE: /config/immich.json
            IMMICH_TELEMETRY_INCLUDE: all
            IMMICH_LOG_FORMAT: json
          envFrom:
            - secretRef:
                name: immich-db
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  persistence:
    immich-config:
      type: secret
      name: immich-config
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: true

machine-learning:
  enabled: false

valkey:
  enabled: true
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
