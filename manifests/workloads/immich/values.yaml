immich:
  persistence:
    library:
      existingClaim: immich-library

server:
  controllers:
    main:
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            DB_HOSTNAME: immich-postgres
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            IMMICH_CONFIG_FILE: /config/immich.json
            IMMICH_TELEMETRY_INCLUDE: all
            IMMICH_LOG_FORMAT: json
            IMMICH_HELMET_FILE: "true"
          envFrom:
            - secretRef:
                name: immich-db
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  persistence:
    immich-config:
      type: secret
      name: immich-config
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: true
    # Trial of a patch restoring HTTP request metrics; v3.3.5 only. See barnes-c/homelab-issues#51.
    immich-http-metrics-patch:
      type: configMap
      name: immich-http-metrics-patch
      advancedMounts:
        main:
          main:
            - path: /usr/src/app/server/dist/repositories/telemetry.repository.js
              subPath: telemetry.repository.js
              readOnly: true
            - path: /usr/src/app/server/dist/app.module.js
              subPath: app.module.js
              readOnly: true
            - path: /usr/src/app/server/dist/middleware/http-route.interceptor.js
              subPath: http-route.interceptor.js
              readOnly: true

machine-learning:
  enabled: false

valkey:
  enabled: true
  controllers:
    main:
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
