apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: remark42-jwt
  namespace: blog-barnes-biz
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: remark42-jwt
  namespace: blog-barnes-biz
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: remark42-jwt
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: remark42-jwt
