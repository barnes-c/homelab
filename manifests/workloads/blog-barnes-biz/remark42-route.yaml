apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: remark42
  namespace: blog-barnes-biz
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - comments.barnes.biz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Envoy appends to a client-sent X-Forwarded-For and remark42 reads its first entry, so
        # without this any client picks the IP remark42 records. See barnes-c/homelab-issues#30.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      backendRefs:
        - group: ""
          kind: Service
          name: remark42
          port: 80
          weight: 1
