# Public: only what visitors' browsers call. Exact matches, because PathPrefix "/count"
# matches whole path segments and would not cover /count.js or /counter/.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter
  namespace: blog-barnes-biz
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
      sectionName: https
  hostnames:
    - stats.barnes.biz
  rules:
    - matches:
        - path:
            type: Exact
            value: /count
        - path:
            type: Exact
            value: /count.js
        - path:
            type: PathPrefix
            value: /counter
      backendRefs:
        - group: ""
          kind: Service
          name: goatcounter
          port: 80
          weight: 1
---
# Dashboard, LAN only. Until a site exists, / offers a form that creates the first admin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter-internal
  namespace: blog-barnes-biz
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - stats.barnes.biz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: goatcounter
          port: 80
          weight: 1
