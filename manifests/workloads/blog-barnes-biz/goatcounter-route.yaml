# Public: only what visitors' browsers call. Exact matches, because PathPrefix "/count"
# matches whole path segments and would not cover /count.js or /counter/.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goatcounter
  namespace: blog-barnes-biz
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - stats.barnes.biz
  rules:
    - matches:
        - path:
            type: Exact
            value: /count
        - path:
            type: Exact
            value: /count.js
        - path:
            type: PathPrefix
            value: /counter
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      backendRefs:
        - group: ""
          kind: Service
          name: goatcounter
          port: 80
          weight: 1
