controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/prowlarr
          tag: 3.1.0.5799@sha256:15b68a6e69f893a3ede6fed405594d3f5d9e9d13648246a0fefbafe4fd7f595b
        env:
          PROWLARR__SERVER__PORT: "9696"
          # Login is handled by the Authentik outpost; the Gateway cannot reach this pod directly.
          PROWLARR__AUTH__METHOD: External
          PROWLARR__LOG__CONSOLEFORMAT: Clef
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 9696

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
