controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/prowlarr
          tag: 3.0.2.5780@sha256:58fa5dbed20738ce0a72077315e818eeb731cb4b4a5173c4a837d343a9573750
        env:
          PROWLARR__SERVER__PORT: "9696"
          # Login is handled by the Authentik outpost; the Gateway cannot reach this pod directly.
          PROWLARR__AUTH__METHOD: External
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 9696

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
