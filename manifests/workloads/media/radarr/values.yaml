controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/radarr
          tag: 7.0.3.10918@sha256:55d3cf8a4c4c531bb8b5c1ba88eb270d4435e01e228fbdb16cdfc910a17e3b06
        env:
          RADARR__SERVER__PORT: "7878"
          RADARR__AUTH__METHOD: Forms
          RADARR__AUTH__REQUIRED: Enabled
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 7878

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
  data:
    existingClaim: media-data
