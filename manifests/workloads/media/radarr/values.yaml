controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/radarr
          tag: 7.1.0.10948@sha256:d259bde2be6b1997c1832cf981d50017f919b305ed3dc9ce445c4661956553f3
        env:
          RADARR__SERVER__PORT: "7878"
          # Login is handled by the Authentik outpost; the Gateway cannot reach this pod directly.
          RADARR__AUTH__METHOD: External
          RADARR__LOG__CONSOLEFORMAT: Clef
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 7878

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
  data:
    existingClaim: media-data
