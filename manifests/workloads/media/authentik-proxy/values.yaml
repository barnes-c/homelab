# Standalone Authentik proxy outpost for the arr UIs, LAN-only behind the private Gateway.
# Configured by the "media" outpost in authentik's sso.yaml blueprint. See barnes-c/homelab-issues#88.
controllers:
  main:
    strategy: RollingUpdate
    containers:
      main:
        image:
          repository: ghcr.io/goauthentik/proxy
          tag: 2026.8.6@sha256:ceb1402294bb71cac3651d88b917302001ccbecad6afcea1f8b6ace101da64df
        env:
          AUTHENTIK_HOST: https://auth.barnes.biz
          AUTHENTIK_INSECURE: "false"
          AUTHENTIK_TOKEN:
            valueFrom:
              secretKeyRef:
                name: authentik-outpost-token
                key: token
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["/authentik", "healthcheck", "proxy"]
              periodSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["/authentik", "healthcheck", "proxy"]
              periodSeconds: 10
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 9000
