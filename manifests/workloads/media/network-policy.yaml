# On top of workloads-baseline (Gateway ingress, DNS egress). Each app may reach only the peers
# and hosts it needs. qBittorrent and Prowlarr have no path to the internet except the WireGuard
# tunnel; this layer holds even if Gluetun fails. See barnes-c/homelab-issues#85.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [sonarr, radarr, authentik-proxy]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
            - port: "8191"
              protocol: TCP
  egress:
    # ch-zrh-wg-001; also pinned in qbittorrent/values.yaml (WIREGUARD_ENDPOINT_IP). Change both.
    - toCIDR:
        - 193.32.127.71/32
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
---
# Indexer traffic goes through Gluetun's HTTP proxy (8888) or FlareSolverr (8191), both in the
# qBittorrent pod's tunnel; Prowlarr itself has no internet egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [sonarr, radarr, authentik-proxy]
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
            - port: "8191"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
---
