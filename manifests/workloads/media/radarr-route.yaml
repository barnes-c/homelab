# Through the Authentik proxy outpost, which forwards to radarr:7878. See barnes-c/homelab-issues#88.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: gateway
      sectionName: https
  hostnames:
    - radarr.barnes.biz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-proxy
          port: 9000
          weight: 1
