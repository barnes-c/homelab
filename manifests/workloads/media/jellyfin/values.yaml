controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/jellyfin/jellyfin
          tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
        env:
          JELLYFIN_PublishedServerUrl: https://jellyfin.barnes.biz
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 4000m
            memory: 4Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8096

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 10Gi
  cache:
    type: emptyDir
    sizeLimit: 10Gi
  data:
    existingClaim: media-data
    globalMounts:
      - path: /data/media
        subPath: media
        readOnly: true
