controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/sonarr
          tag: 5.0.0.3041@sha256:ec7797f30e65cc411fba6768ed575337a5787de7d06c382173df610f2d23a317
        env:
          SONARR__SERVER__PORT: "8989"
          # Login is handled by the Authentik outpost; the Gateway cannot reach this pod directly.
          SONARR__AUTH__METHOD: External
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8989

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
  data:
    existingClaim: media-data
