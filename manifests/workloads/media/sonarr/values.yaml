controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/home-operations/sonarr
          tag: 5.0.0.2997@sha256:05acf764e72fa458b5edf236771d7a08d1f120fce509d4fb8a4e799fae29fda7
        env:
          SONARR__SERVER__PORT: "8989"
          SONARR__AUTH__METHOD: Forms
          # The Gateway reaches pods from cluster (private) addresses, so
          # DisabledForLocalAddresses would mean no login at all.
          SONARR__AUTH__REQUIRED: Enabled
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8989

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
  data:
    existingClaim: media-data
