defaultSettings:
  # Matches the UserVolumeConfig named "longhorn" in cluster/tofu/talos; Talos mounts
  # user volumes at /var/mnt/<name>.
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: "1"
  replicaAutoBalance: disabled
  # Every volume has one replica, so the default (block-if-contains-last-replica) blocks
  # every drain. This lets the drain proceed once evicted pods have detached their volumes.
  nodeDrainPolicy: allow-if-replica-is-stopped
  # Only nodes labelled node.longhorn.io/create-default-disk get a disk; with "config" its
  # path and tags come from the node.longhorn.io/default-disks-config annotation.
  # Without this Longhorn creates one at defaultDataPath on EVERY node, and on a
  # worker whose only storage is an SD card it would silently create that
  # directory and start writing replicas to it. Both are set per node in
  # cluster/tofu/talos/variables.tf (node_labels, node_annotations).
  createDefaultDiskLabeledNodes: "true"
# Retiring an app (finalizer cascade) deletes its PVCs; Retain keeps the volume and its data.
persistence:
  reclaimPolicy: Retain
  # Persistent data lives only on rpi5b-cp-01, whose disk is a RAID1 mirror; a second
  # replica on the other node would add little. Scratch data uses longhorn-scratch instead.
  defaultClassReplicaCount: 1
  defaultDiskSelector:
    enable: true
    selector: persistent
preUpgradeChecker:
  jobEnabled: false
longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
longhornGlobalManager:
  replicas: 2
longhornUI:
  replicas: 0
longhornDriver:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
csi:
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1
