# Every manifest in this directory must be listed here; unlisted files are not synced.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - authentik-route.yaml
  - authentik-secrets.yaml
  - network-policy.yaml
  - oidc-client-readers.yaml
  - oidc-clients.yaml
  - smtp-credentials.yaml
configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/sso.yaml
      - blueprints/mfa.yaml
      - blueprints/invitation.yaml
      - blueprints/recovery.yaml
      - blueprints/sessions.yaml
      - blueprints/notifications.yaml
      - blueprints/reputation.yaml
generatorOptions:
  # values.yaml mounts it by this name, on the worker at /blueprints/custom.
  disableNameSuffixHash: true
