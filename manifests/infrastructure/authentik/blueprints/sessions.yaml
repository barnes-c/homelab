# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Session hardening
entries:
  # A new login ends the user's other Authentik sessions; app sessions (Immich, Grafana,
  # Argo CD) are separate and stay. No 30-day remembered-device cookie.
  - model: authentik_stages_user_login.userloginstage
    state: present
    identifiers:
      name: default-authentication-login
    attrs:
      terminate_other_sessions: true
      remember_device: seconds=0
