# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Require MFA
entries:
  # WebAuthn only: TOTP and recovery codes can be phished. The shipped login flow skips MFA
  # for users without a device; this makes them enroll a passkey at their next login instead.
  # Devices of other classes are ignored, so a TOTP-only user counts as having none.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    state: present
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes:
        - webauthn
      webauthn_user_verification: required
      not_configured_action: configure
      configuration_stages:
        - !Find
          - authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
          - [name, default-authenticator-webauthn-setup]

  # Overriding the shipped stage is safe: its default blueprint sets no user_verification.
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    state: present
    identifiers:
      name: default-authenticator-webauthn-setup
    attrs:
      user_verification: required
