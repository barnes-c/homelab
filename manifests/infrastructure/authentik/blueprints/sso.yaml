# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: SSO Applications

entries:
  # Groups. An application with group bindings admits only members of those groups;
  # without any binding it admits every Authentik user.
  - model: authentik_core.group
    id: grafana-admins
    state: present
    identifiers:
      name: Grafana Admins

  - model: authentik_core.group
    id: grafana-editors
    state: present
    identifiers:
      name: Grafana Editors

  - model: authentik_core.group
    id: argocd-admins
    state: present
    identifiers:
      name: ArgoCD Admins

  - model: authentik_core.group
    id: immich-users
    state: present
    identifiers:
      name: Immich Users

  # Grafana
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    state: present
    identifiers:
      name: Grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env GRAFANA_CLIENT_ID
      client_secret: !Env GRAFANA_CLIENT_SECRET
      redirect_uris:
        - url: "https://monitoring.barnes.biz/login/generic_oauth"
          matching_mode: "strict"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: grafana-app
    state: present
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://monitoring.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf grafana-app
      group: !KeyOf grafana-admins
      order: 0

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf grafana-app
      group: !KeyOf grafana-editors
      order: 1

  # ArgoCD
  - model: authentik_providers_oauth2.oauth2provider
    id: argocd-provider
    state: present
    identifiers:
      name: ArgoCD
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env ARGOCD_CLIENT_ID
      client_secret: !Env ARGOCD_CLIENT_SECRET
      redirect_uris:
        - url: "https://argo.barnes.biz/auth/callback"
          matching_mode: "strict"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: argocd-app
    state: present
    identifiers:
      slug: argocd
    attrs:
      name: ArgoCD
      provider: !KeyOf argocd-provider
      meta_launch_url: https://argo.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf argocd-app
      group: !KeyOf argocd-admins
      order: 0

  # Immich
  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    state: present
    identifiers:
      name: Immich
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env IMMICH_CLIENT_ID
      client_secret: !Env IMMICH_CLIENT_SECRET
      redirect_uris:
        - url: "https://img.barnes.biz/auth/login"
          matching_mode: "strict"
        - url: "app.immich:/"
          matching_mode: "strict"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: immich-app
    state: present
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      meta_launch_url: https://img.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf immich-app
      group: !KeyOf immich-users
      order: 0

  - model: authentik_core.application
    state: absent
    identifiers:
      slug: website-dashboard

  - model: authentik_providers_proxy.proxyprovider
    state: absent
    identifiers:
      name: Website Dashboard
