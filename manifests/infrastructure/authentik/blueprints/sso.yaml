# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: SSO Applications

entries:
  # Groups. An application with group bindings admits only members of those groups;
  # without any binding it admits every Authentik user.
  - model: authentik_core.group
    id: grafana-admins
    state: present
    identifiers:
      name: Grafana Admins

  - model: authentik_core.group
    id: grafana-editors
    state: present
    identifiers:
      name: Grafana Editors

  - model: authentik_core.group
    id: argocd-admins
    state: present
    identifiers:
      name: ArgoCD Admins

  - model: authentik_core.group
    id: immich-users
    state: present
    identifiers:
      name: Immich Users

  - model: authentik_core.group
    id: media-admins
    state: present
    identifiers:
      name: Media Admins

  # Grafana
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    state: present
    identifiers:
      name: Grafana
    attrs:
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: !Env GRAFANA_CLIENT_ID
      client_secret: !Env GRAFANA_CLIENT_SECRET
      redirect_uris:
        - url: "https://monitoring.barnes.biz/login/generic_oauth"
          matching_mode: "strict"
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, "authentik Self-signed Certificate"],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: grafana-app
    state: present
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://monitoring.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf grafana-app
      group: !KeyOf grafana-admins
      order: 0

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf grafana-app
      group: !KeyOf grafana-editors
      order: 1

  # ArgoCD
  - model: authentik_providers_oauth2.oauth2provider
    id: argocd-provider
    state: present
    identifiers:
      name: ArgoCD
    attrs:
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: !Env ARGOCD_CLIENT_ID
      client_secret: !Env ARGOCD_CLIENT_SECRET
      refresh_token_threshold: days=1
      redirect_uris:
        - url: "https://argo.barnes.biz/auth/callback"
          matching_mode: "strict"
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, "authentik Self-signed Certificate"],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

  - model: authentik_core.application
    id: argocd-app
    state: present
    identifiers:
      slug: argocd
    attrs:
      name: ArgoCD
      provider: !KeyOf argocd-provider
      meta_launch_url: https://argo.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf argocd-app
      group: !KeyOf argocd-admins
      order: 0

  # Immich
  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    state: present
    identifiers:
      name: Immich
    attrs:
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: !Env IMMICH_CLIENT_ID
      client_secret: !Env IMMICH_CLIENT_SECRET
      redirect_uris:
        - url: "https://img.barnes.biz/auth/login"
          matching_mode: "strict"
        - url: "app.immich:///oauth-callback"
          matching_mode: "strict"
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, "authentik Self-signed Certificate"],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: immich-app
    state: present
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      meta_launch_url: https://img.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf immich-app
      group: !KeyOf immich-users
      order: 0

  # Media admin UIs, proxied by the standalone outpost in the media namespace (LAN-only).
  # Its token is sealed in media; the embedded outpost stays disabled. See barnes-c/homelab-issues#88.
  - model: authentik_providers_proxy.proxyprovider
    id: sonarr-provider
    state: present
    identifiers:
      name: Sonarr
    attrs:
      mode: proxy
      external_host: https://sonarr.barnes.biz
      internal_host: http://sonarr.media.svc.cluster.local:8989
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: sonarr-app
    state: present
    identifiers:
      slug: sonarr
    attrs:
      name: Sonarr
      provider: !KeyOf sonarr-provider
      meta_launch_url: https://sonarr.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf sonarr-app
      group: !KeyOf media-admins
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: radarr-provider
    state: present
    identifiers:
      name: Radarr
    attrs:
      mode: proxy
      external_host: https://radarr.barnes.biz
      internal_host: http://radarr.media.svc.cluster.local:7878
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: radarr-app
    state: present
    identifiers:
      slug: radarr
    attrs:
      name: Radarr
      provider: !KeyOf radarr-provider
      meta_launch_url: https://radarr.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf radarr-app
      group: !KeyOf media-admins
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: prowlarr-provider
    state: present
    identifiers:
      name: Prowlarr
    attrs:
      mode: proxy
      external_host: https://prowlarr.barnes.biz
      internal_host: http://prowlarr.media.svc.cluster.local:9696
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: prowlarr-app
    state: present
    identifiers:
      slug: prowlarr
    attrs:
      name: Prowlarr
      provider: !KeyOf prowlarr-provider
      meta_launch_url: https://prowlarr.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf prowlarr-app
      group: !KeyOf media-admins
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: bazarr-provider
    state: present
    identifiers:
      name: Bazarr
    attrs:
      mode: proxy
      external_host: https://bazarr.barnes.biz
      internal_host: http://bazarr.media.svc.cluster.local:6767
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: bazarr-app
    state: present
    identifiers:
      slug: bazarr
    attrs:
      name: Bazarr
      provider: !KeyOf bazarr-provider
      meta_launch_url: https://bazarr.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf bazarr-app
      group: !KeyOf media-admins
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: qbittorrent-provider
    state: present
    identifiers:
      name: qBittorrent
    attrs:
      mode: proxy
      external_host: https://qbittorrent.barnes.biz
      internal_host: http://qbittorrent.media.svc.cluster.local:8080
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-explicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: qbittorrent-app
    state: present
    identifiers:
      slug: qbittorrent
    attrs:
      name: qBittorrent
      provider: !KeyOf qbittorrent-provider
      meta_launch_url: https://qbittorrent.barnes.biz

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf qbittorrent-app
      group: !KeyOf media-admins
      order: 0

  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: media
    attrs:
      type: proxy
      providers:
        - !KeyOf sonarr-provider
        - !KeyOf radarr-provider
        - !KeyOf prowlarr-provider
        - !KeyOf bazarr-provider
        - !KeyOf qbittorrent-provider
      config:
        authentik_host: https://auth.barnes.biz
