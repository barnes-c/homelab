global:
  envFrom:
    - secretRef:
        name: authentik-secrets
    - secretRef:
        name: authentik-db
    - secretRef:
        name: oidc-argocd
    - secretRef:
        name: oidc-grafana
    - secretRef:
        name: oidc-immich
    - secretRef:
        name: smtp-credentials

authentik:
  disable_update_check: true
  outposts:
    disable_embedded_outpost: true
  secret_key: ""
  postgresql:
    password: ""
  email:
    host: smtp.mail.me.com
    port: 587
    use_tls: true
    use_ssl: false
    from: "Auth for barnes.biz <noreply@barnes.biz>"
    username: ""
    password: ""

server:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  startupProbe:
    periodSeconds: 10
    failureThreshold: 120
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5

worker:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  startupProbe:
    periodSeconds: 10
    failureThreshold: 120
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
  # Worker only: it imports the blueprints. Kept at the old path on purpose: Authentik keys
  # blueprint instances by path and requires unique names, so a new path would fail to import.
  volumes:
    - name: blueprints
      configMap:
        name: authentik-blueprints
  volumeMounts:
    - name: blueprints
      mountPath: /blueprints/custom

serviceAccount:
  create: false

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-db
    secretKeys:
      adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
      userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      storageClass: longhorn
      size: 5Gi
