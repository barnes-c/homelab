apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik
  namespace: authentik
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    # Logins, and the OIDC calls of Grafana, Argo CD and Immich, which loop back through
    # the public IP.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    - toEndpoints:
        - {}
    # The DNS rule sends lookups through Cilium's proxy, which is what lets toFQDNs work.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # The worker checks the Kubernetes outpost integration.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toFQDNs:
        - matchName: smtp.mail.me.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
