# Postgres stores its password at first init: rotating authentik-db means ALTER ROLE first, see #31.
# authentik-db is the only Secret the Postgres pod mounts; the secret key stays out of it.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - AUTHENTIK_POSTGRESQL__PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: authentik-db
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-db
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - AUTHENTIK_SECRET_KEY
    - AUTHENTIK_BOOTSTRAP_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: authentik-secrets
    creationPolicy: Orphan
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-secrets
