# Workload pods never talk to the Kubernetes API, so they get no ServiceAccount token.
# Pods that set automountServiceAccountToken explicitly are left alone.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: no-service-account-token
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: unset
      expression: "!has(object.spec.automountServiceAccountToken)"
  # Hardening only: if the policy errors, start the pod with a token rather than not at all.
  failurePolicy: Ignore
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: "Object{spec: Object.spec{automountServiceAccountToken: false}}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: no-service-account-token
spec:
  policyName: no-service-account-token
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [barnes-biz, blog-barnes-biz, immich]
