apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook-porkbun
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-porkbun
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager-webhook-porkbun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager-webhook-porkbun
    spec:
      serviceAccountName: cert-manager-webhook-porkbun
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: docker.io/pabloa/cert-manager-webhook-porkbun:1.1.3@sha256:245354f0b579908bfe383d2c21ca92d9b64cdb23c62c3e8e34e37590df918c4d
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            # Arbitrary, but must match the APIService name, the domain-solver
            # ClusterRole and the ClusterIssuer's webhook.groupName.
            - name: GROUP_NAME
              value: acme.barnes.biz
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: cert-manager-webhook-porkbun-webhook-tls
