apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-webhook-porkbun
  namespace: cert-manager
---
# Lets the webhook read the apiserver's requestheader CA so it can authenticate
# requests arriving through the aggregation layer.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-porkbun:webhook-authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-porkbun
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-webhook-porkbun:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-porkbun
    namespace: cert-manager
---
# cert-manager invokes the solver by POSTing a ChallengePayload into this API group. The
# resource is the ClusterIssuer's solverName; upstream grants "*".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-webhook-porkbun:domain-solver
rules:
  - apiGroups:
      - acme.barnes.biz
    resources:
      - porkbun
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-webhook-porkbun:domain-solver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-webhook-porkbun:domain-solver
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# Upstream binds a ClusterRole granting get/watch/list on secrets in every namespace. The
# webhook only ever does a single Get of the Porkbun credential in cert-manager's cluster
# resource namespace, so this is narrowed to a Role over that one secret. Re-check on
# every image bump. See barnes-c/homelab-issues#26
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-porkbun:secret-reader
  namespace: cert-manager
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - porkbun-api-key
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-porkbun:secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-porkbun:secret-reader
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-porkbun
    namespace: cert-manager
