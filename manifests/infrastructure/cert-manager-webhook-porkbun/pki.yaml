# Serving certificate for the aggregated API. Self-signed on purpose: the apiserver
# trusts it via the caBundle that cainjector writes into the APIService, not via a
# public root.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-webhook-porkbun-selfsign
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-webhook-porkbun-ca
  namespace: cert-manager
spec:
  secretName: cert-manager-webhook-porkbun-ca
  duration: 43800h # 5y
  issuerRef:
    name: cert-manager-webhook-porkbun-selfsign
  commonName: ca.porkbun.cert-manager
  isCA: true
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-webhook-porkbun-ca
  namespace: cert-manager
spec:
  ca:
    secretName: cert-manager-webhook-porkbun-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-webhook-porkbun-webhook-tls
  namespace: cert-manager
spec:
  secretName: cert-manager-webhook-porkbun-webhook-tls
  duration: 8760h # 1y
  issuerRef:
    name: cert-manager-webhook-porkbun-ca
  dnsNames:
    - cert-manager-webhook-porkbun
    - cert-manager-webhook-porkbun.cert-manager
    - cert-manager-webhook-porkbun.cert-manager.svc
