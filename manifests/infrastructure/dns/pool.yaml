# Pinned: the Freebox hands this out as the LAN DNS server via DHCP. See barnes-c/homelab-issues#86.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: dns-pool
spec:
  blocks:
    - start: "192.168.1.203"
      stop: "192.168.1.203"
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: blocky
