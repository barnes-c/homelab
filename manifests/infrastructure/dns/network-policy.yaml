apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blocky
  namespace: dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: blocky
  ingress:
    - fromCIDR:
        - 192.168.1.0/24
      fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5353"
              protocol: ANY
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: unbound
      toPorts:
        - ports:
            - port: "5335"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: k8s-gateway
      toPorts:
        - ports:
            - port: "1053"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unbound
  namespace: dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unbound
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: blocky
      toPorts:
        - ports:
            - port: "5335"
              protocol: ANY
  egress:
    - toCIDR:
        - 193.32.127.70/32
        - 193.32.127.72/32
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway
  namespace: dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: blocky
      toPorts:
        - ports:
            - port: "1053"
              protocol: ANY
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
