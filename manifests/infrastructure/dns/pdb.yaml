# The whole LAN resolves through these; keep one of each up through node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blocky
  namespace: dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unbound
  namespace: dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unbound
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: k8s-gateway
  namespace: dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
