# Reloader only talks to the Kubernetes API; it serves nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader
  namespace: reloader
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
