reloader:
  reloadStrategy: annotations
  ignoreJobs: true
  ignoreCronJobs: true
  readOnlyRootFileSystem: true
  deployment:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
