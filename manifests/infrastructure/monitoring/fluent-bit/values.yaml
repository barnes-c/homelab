fullnameOverride: fluent-bit

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    # The GeoIP database (~130 MB) is mmapped; its page cache counts against this limit.
    memory: 256Mi

# DB-IP City Lite (CC BY 4.0) for the geoip2 filter. Cached on the node, so a failed download
# at pod start keeps the previous month's database instead of stopping log shipping.
initContainers:
  - name: geoip-db
    image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    command: [sh, -c]
    args:
      - |
        db=/geoip/dbip-city-lite.mmdb
        for m in $(date -u +%Y-%m) $(date -u -d @$(($(date +%s) - 32 * 86400)) +%Y-%m); do
          if curl -fsSL --max-time 300 "https://download.db-ip.com/free/dbip-city-lite-$m.mmdb.gz" \
              | gunzip > "$db.new" && [ -s "$db.new" ]; then
            mv "$db.new" "$db"
            echo "DB-IP City Lite $m"
            exit 0
          fi
        done
        rm -f "$db.new"
        if [ -s "$db" ]; then echo "download failed, keeping cached database"; exit 0; fi
        echo "download failed and no cached database"
        exit 1
    # The hostPath directory is created root-owned; fluent-bit itself already runs as root.
    securityContext:
      runAsUser: 0
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 500m
        memory: 64Mi
    volumeMounts:
      - name: geoip
        mountPath: /geoip

extraVolumes:
  - name: geoip
    hostPath:
      path: /var/lib/fluent-bit-geoip
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: geoip
    mountPath: /geoip
    readOnly: true

# Mounted at /fluent-bit/scripts. A Lua filter rather than `modify`, because modify's regex
# conditions skip non-string values and Envoy's response_code is a number.
luaScripts:
  log-levels.lua: |
    -- Sets `level` on records whose format carries a level Loki doesn't recognise, or none.
    -- Records that already have one (app JSON, the klog filters) are left alone.
    local zap = {
      DEBUG = "debug", INFO = "info", WARN = "warning", ERROR = "error",
      DPANIC = "critical", PANIC = "critical", FATAL = "fatal",
    }
    local valkey = { ["."] = "debug", ["-"] = "debug", ["*"] = "info", ["#"] = "warning" }
    local postgres = {
      LOG = "info", INFO = "info", NOTICE = "info", STATEMENT = "info", DETAIL = "info",
      HINT = "info", CONTEXT = "info", WARNING = "warning", ERROR = "error",
      FATAL = "fatal", PANIC = "critical",
    }

    -- 0 is Envoy's code when no response was sent (client gone, upstream reset).
    local function from_status(code)
      code = tonumber(code)
      if not code then return nil end
      if code >= 500 then return "error" end
      if code >= 400 or code == 0 then return "warning" end
      return "info"
    end

    local function detect(record)
      if record.response_code ~= nil then
        return from_status(record.response_code)
      end
      local line = record.log
      if type(line) ~= "string" then return nil end
      -- Combined access log: ip - user [time] "request" status ...
      local status = line:match('^%S+ %- %S+ %[[^%]]+%] "[^"]*" (%d%d%d) ')
      if status then return from_status(status) end
      -- zap console encoder (trivy): time<TAB>LEVEL<TAB>msg
      local z = line:match("^%S+\t(%u+)\t")
      if z then return zap[z] end
      -- Valkey/Redis: pid:role dd Mon yyyy hh:mm:ss.mmm <marker> msg
      local v = line:match("^%d+:%a %d+ %a+ %d+ [%d:%.]+ ([%.%-%*#]) ")
      if v then return valkey[v] end
      -- Postgres: yyyy-mm-dd hh:mm:ss.mmm TZ [pid] SEVERITY:  msg
      local p = line:match("^%d+%-%d+%-%d+ [%d:%.]+ %a+ %[%d+%] (%u+):")
      if p then return postgres[p] end
      return nil
    end

    function set_level(tag, timestamp, record)
      if record.level ~= nil then return 0, timestamp, record end
      local level = detect(record)
      if level == nil then return 0, timestamp, record end
      record.level = level
      return 1, timestamp, record
    end

config:
  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        # The 32k default is smaller than the cilium-agent pod object; metadata lookup fails.
        Buffer_Size         256k

    # NestJS apps (Immich) log info as "log", which Loki's level detection doesn't know.
    [FILTER]
        Name       modify
        Match      kube.*
        Condition  Key_Value_Equals level log
        Set        level info

    # klog lines (I1023 ...) carry their severity in the prefix. Without a level field Loki
    # guesses from keywords, so an info line containing "error=" shows up as an error.
    [FILTER]
        Name       modify
        Match      kube.*
        Condition  Key_does_not_exist level
        Condition  Key_value_matches log ^I\d{4}
        Set        level info

    [FILTER]
        Name       modify
        Match      kube.*
        Condition  Key_does_not_exist level
        Condition  Key_value_matches log ^W\d{4}
        Set        level warning

    [FILTER]
        Name       modify
        Match      kube.*
        Condition  Key_does_not_exist level
        Condition  Key_value_matches log ^E\d{4}
        Set        level error

    [FILTER]
        Name       modify
        Match      kube.*
        Condition  Key_does_not_exist level
        Condition  Key_value_matches log ^F\d{4}
        Set        level fatal

    # Formats with no level Loki recognises (access logs, Postgres, Valkey, zap console); see the script.
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/log-levels.lua
        call    set_level

    # The blog's kubelet probes are ~95% of its log volume and carry no information.
    [FILTER]
        Name     grep
        Match    kube.var.log.containers.blog-*_blog-barnes-biz_blog-*
        Exclude  log kube-probe/

    # Gateway access logs (CiliumGatewayClassConfig `gateway/access-logs`). Records without a
    # public client_ip get nulls; the filter only adds fields.
    [FILTER]
        Name        geoip2
        Match       kube.var.log.containers.cilium-envoy-*_kube-system_cilium-envoy-*
        Database    /geoip/dbip-city-lite.mmdb
        Lookup_key  client_ip
        Record      geo_country_code client_ip %{country.iso_code}
        Record      geo_country      client_ip %{country.names.en}
        Record      geo_city         client_ip %{city.names.en}
        Record      geo_lat          client_ip %{location.latitude}
        Record      geo_lon          client_ip %{location.longitude}

  outputs: |
    [OUTPUT]
        Name                 loki
        Match                kube.*
        Host                 loki.monitoring.svc.cluster.local
        Port                 3100
        Labels               job=fluent-bit
        Label_Map_Path       /fluent-bit/etc/conf/loki-labels.json

  extraFiles:
    loki-labels.json: |
      {
        "kubernetes": {
          "namespace_name": "namespace",
          "pod_name": "pod",
          "container_name": "container",
          "labels": {"app.kubernetes.io/name": "app"}
        }
      }
