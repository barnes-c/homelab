fullnameOverride: fluent-bit

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

config:
  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        # The 32k default is smaller than the cilium-agent pod object; metadata lookup fails.
        Buffer_Size         256k

    # NestJS apps (Immich) log info as "log", which Loki's level detection doesn't know.
    [FILTER]
        Name       modify
        Match      kube.*
        Condition  Key_Value_Equals level log
        Set        level info

  outputs: |
    [OUTPUT]
        Name                 loki
        Match                kube.*
        Host                 loki.monitoring.svc.cluster.local
        Port                 3100
        Labels               job=fluent-bit
        Label_Map_Path       /fluent-bit/etc/conf/loki-labels.json

  extraFiles:
    loki-labels.json: |
      {
        "kubernetes": {
          "namespace_name": "namespace",
          "pod_name": "pod",
          "container_name": "container",
          "labels": {"app.kubernetes.io/name": "app"}
        }
      }
