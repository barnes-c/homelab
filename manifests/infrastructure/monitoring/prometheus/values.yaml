fullnameOverride: prometheus

server:
  fullnameOverride: prometheus
  retention: 15d
  # Under persistentVolume.size so blocks evict before the disk fills; base-2 units. See barnes-c/homelab-issues#25.
  retentionSize: 8GB
  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

# Labels that change on every chart or image bump split a series in two.
scrapeConfigs:
  kubernetes-service-endpoints:
    # Endpoint discovery also targets container ports the Service doesn't list; keep only listed ones.
    pre_relabel_configs: |
      - source_labels: [__meta_kubernetes_endpointslice_port]
        action: drop
        regex: ""
    post_relabel_configs: |
      - action: labeldrop
        regex: helm_sh_chart|app_kubernetes_io_version|pod_template_hash|controller_revision_hash|pod_template_generation
  kubernetes-pods:
    post_relabel_configs: |
      - action: labeldrop
        regex: helm_sh_chart|app_kubernetes_io_version|pod_template_hash|controller_revision_hash|pod_template_generation
  blackbox:
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://barnes.biz
          - https://www.barnes.biz
          - https://blog.barnes.biz
          - https://comments.barnes.biz/web/embed.js
          - https://stats.barnes.biz/count.js
          - https://img.barnes.biz/api/server/ping
          - https://auth.barnes.biz/-/health/ready/
          - https://argo.barnes.biz/healthz
          - https://monitoring.barnes.biz/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
