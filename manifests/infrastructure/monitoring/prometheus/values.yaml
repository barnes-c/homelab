fullnameOverride: prometheus

server:
  fullnameOverride: prometheus
  retention: 15d
  # Under persistentVolume.size so blocks evict before the disk fills; base-2 units. See barnes-c/homelab-issues#25.
  retentionSize: 8GB
  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

# Labels that change on every chart or image bump split a series in two.
scrapeConfigs:
  kubernetes-service-endpoints:
    post_relabel_configs: |
      - action: labeldrop
        regex: helm_sh_chart|app_kubernetes_io_version|pod_template_hash|controller_revision_hash|pod_template_generation
  kubernetes-pods:
    post_relabel_configs: |
      - action: labeldrop
        regex: helm_sh_chart|app_kubernetes_io_version|pod_template_hash|controller_revision_hash|pod_template_generation
