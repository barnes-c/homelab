fullnameOverride: grafana

env:
  GF_PROVISIONING_ENABLE_ENV_EXPANSION: "true"

envFromSecrets:
  - name: grafana-oidc
  - name: grafana-secret-key

resources:
  requests:
    cpu: 50m
    memory: 320Mi
  limits:
    cpu: 500m
    memory: 1Gi

startupProbe:
  httpGet:
    path: /api/health
    port: grafana
  periodSeconds: 10
  failureThreshold: 30

persistence:
  enabled: true
  size: 1Gi

initChownData:
  enabled: false

deploymentStrategy:
  type: Recreate

admin:
  existingSecret: grafana-admin

smtp:
  existingSecret: grafana-smtp

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
    feedback_links_enabled: false
  snapshots:
    external_enabled: false
  public_dashboards:
    enabled: false
  cloud_migration:
    enabled: false
  news:
    news_feed_enabled: false
  plugins:
    plugin_admin_enabled: false
    disable_plugins: >-
      cloudwatch,elasticsearch,grafana-postgresql-datasource,influxdb,mssql,mysql,opentsdb,stackdriver,
      jaeger,zipkin,tempo,grafana-pyroscope-datasource,grafana-exploretraces-app,grafana-pyroscope-app
  server:
    domain: monitoring.barnes.biz
    root_url: https://monitoring.barnes.biz
  security:
    disable_initial_admin_creation: true
    disable_gravatar: true
    cookie_secure: true
  auth:
    disable_login_form: true
    signout_redirect_url: https://auth.barnes.biz/application/o/grafana/end-session/
  auth.basic:
    enabled: false
  auth.generic_oauth:
    enabled: true
    name: Authentik
    allow_sign_up: true
    auto_login: true
    client_id: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
    client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
    scopes: openid profile email
    auth_url: https://auth.barnes.biz/application/o/authorize/
    token_url: https://auth.barnes.biz/application/o/token/
    api_url: https://auth.barnes.biz/application/o/userinfo/
    use_pkce: true
    validate_id_token: true
    jwk_set_url: https://auth.barnes.biz/application/o/grafana/jwks/
    allow_assign_grafana_admin: true
    role_attribute_path: >-
      contains(groups, 'Grafana Admins') && 'GrafanaAdmin' ||
      contains(groups, 'Grafana Editors') && 'Editor'
    role_attribute_strict: true
  smtp:
    enabled: true
    host: smtp.mail.me.com:587
    from_address: noreply@barnes.biz
    from_name: Grafana for barnes.biz
    startTLS_policy: MandatoryStartTLS

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: infrastructure
        orgId: 1
        folder: Infrastructure
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/infrastructure
      - name: kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes

dashboards:
  infrastructure:
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
  kubernetes:
    k8s-views-pods:
      gnetId: 15760
      revision: 37
      datasource: Prometheus
    trivy-operator:
      gnetId: 17813
      revision: 2
      datasource: Prometheus

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
        # Prometheus's global scrape_interval. Without it $__rate_interval assumes 15s and rate() comes back empty.
        jsonData:
          timeInterval: 1m
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
