fullnameOverride: grafana

env:
  GF_PROVISIONING_ENABLE_ENV_EXPANSION: "true"

envFromSecrets:
  - name: grafana-oidc

resources:
  requests:
    cpu: 50m
    memory: 320Mi
  limits:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  size: 1Gi

initChownData:
  enabled: false

deploymentStrategy:
  type: Recreate

admin:
  existingSecret: grafana-admin

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  news:
    news_feed_enabled: false
  server:
    domain: monitoring.barnes.biz
    root_url: https://monitoring.barnes.biz
  security:
    disable_initial_admin_creation: true
  auth:
    disable_login_form: true
    signout_redirect_url: https://auth.barnes.biz/application/o/grafana/end-session/
  auth.generic_oauth:
    enabled: true
    name: Authentik
    allow_sign_up: true
    auto_login: true
    client_id: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
    client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
    scopes: openid profile email
    auth_url: https://auth.barnes.biz/application/o/authorize/
    token_url: https://auth.barnes.biz/application/o/token/
    api_url: https://auth.barnes.biz/application/o/userinfo/
    role_attribute_path: >-
      contains(groups, 'Grafana Admins') && 'Admin' ||
      contains(groups, 'Grafana Editors') && 'Editor'
    role_attribute_strict: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: infrastructure
        orgId: 1
        folder: Infrastructure
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/infrastructure
      - name: kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes

dashboards:
  infrastructure:
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
  kubernetes:
    k8s-views-pods:
      gnetId: 15760
      revision: 37
      datasource: Prometheus
    trivy-operator:
      gnetId: 17813
      revision: 2
      datasource: Prometheus

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
        # Prometheus's global scrape_interval. Without it $__rate_interval assumes 15s and rate() comes back empty.
        jsonData:
          timeInterval: 1m
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy

annotations:
  reloader.stakater.com/auto: "true"
