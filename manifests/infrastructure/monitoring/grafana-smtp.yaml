apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-smtp
  namespace: monitoring
spec:
  secretStoreRef:
    kind: SecretStore
    name: authentik
  target:
    name: grafana-smtp
  data:
    - secretKey: user
      remoteRef:
        key: smtp-credentials
        property: AUTHENTIK_EMAIL__USERNAME
    - secretKey: password
      remoteRef:
        key: smtp-credentials
        property: AUTHENTIK_EMAIL__PASSWORD
