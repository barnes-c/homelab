# Pinned: the Freebox forwards 80/443 here. Gateway annotations don't reach the generated
# Service, so a single-address pool selected by Gateway name is the only way to pin it.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-gateway-pool
spec:
  blocks:
    - start: "192.168.1.201"
      stop: "192.168.1.201"
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: public
---
# Pinned so the Freebox rules and local DNS can rely on .202.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: private-gateway-pool
spec:
  blocks:
    - start: "192.168.1.202"
      stop: "192.168.1.202"
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: private
