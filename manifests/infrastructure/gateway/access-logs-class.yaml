# Cilium attaches Gateway access logs only through GatewayClass.spec.parametersRef; it rejects
# Gateway.spec.infrastructure.parametersRef, and the chart's `cilium` class has no value for
# it. Hence a second class. Logs go to cilium-envoy stdout, where fluent-bit adds GeoIP.
# See barnes-c/homelab-issues#73.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: access-logs
  namespace: gateway
spec:
  telemetry:
    accessLogs:
      - format: JSON
        json:
          gateway: "%CILIUM_GATEWAY_NAMESPACE%/%CILIUM_GATEWAY_NAME%"
          client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
          method: "%REQUEST_HEADER(:METHOD)%"
          authority: "%REQUEST_HEADER(:AUTHORITY)%"
          # Without the query string: Immich share links carry their key in `?key=`.
          path: "%PATH(NQ)%"
          protocol: "%PROTOCOL%"
          response_code: "%RESPONSE_CODE%"
          response_flags: "%RESPONSE_FLAGS%"
          bytes_received: "%BYTES_RECEIVED%"
          bytes_sent: "%BYTES_SENT%"
          duration: "%DURATION%"
          user_agent: "%REQUEST_HEADER(USER-AGENT)%"
          upstream_host: "%UPSTREAM_HOST%"
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-access-logs
spec:
  controllerName: io.cilium/gateway-controller
  description: Cilium with Envoy access logs on stdout
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: access-logs
    namespace: gateway
