# One security.txt for every public host. Hostnames must be exact: a wildcard route loses to
# the apps' exact-hostname routes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security-txt
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - auth.barnes.biz
    - barnes.biz
    - blog.barnes.biz
    - comments.barnes.biz
    - img.barnes.biz
    - stats.barnes.biz
    - www.barnes.biz
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/security.txt
      backendRefs:
        - name: security-txt
          port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-txt
  namespace: gateway
data:
  security.txt: |
    Contact: mailto:security@barnes.biz
    Expires: 2030-01-01T00:00:00.000Z
    Preferred-Languages: en
  default.conf: |
    server {
        listen 8080;
        location = /.well-known/security.txt {
            types { }
            default_type "text/plain; charset=utf-8";
            alias /srv/security-txt/security.txt;
        }
        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-txt
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-txt
  template:
    metadata:
      labels:
        app: security-txt
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/nginx/nginx-unprivileged:1.31-alpine@sha256:60214a103e6f38e953ff957f34b1f2e97a9db801ab2df3821da955d0fe6cadd6
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /.well-known/security.txt
              port: 8080
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # No subPath, so ConfigMap edits reach the file without a restart.
            - name: config
              mountPath: /srv/security-txt
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: security-txt
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: security-txt
  namespace: gateway
spec:
  selector:
    app: security-txt
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: security-txt
  namespace: gateway
spec:
  endpointSelector:
    matchLabels:
      app: security-txt
  ingress:
    - fromEntities:
        - ingress
  egress: []
