apiVersion: v1
kind: Namespace
metadata:
  name: ddns
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: porkbun-ddns
  namespace: ddns
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ddns
              image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              env:
                - name: PORKBUN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: porkbun-api-key
                      key: api-key
                - name: PORKBUN_SECRET_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: porkbun-api-key
                      key: secret-api-key
                - name: ZONE
                  value: barnes.biz
                # Subdomain labels, not FQDNs -- Porkbun addresses records by label, with
                # the empty string for the apex. "@" is spelled out here and translated
                # below to keep the list readable.
                - name: RECORDS
                  value: "@,*"
              command:
                - sh
                - -c
                - |
                  # -f: RECORDS contains "*", which would otherwise glob against the cwd
                  # when the loop word-splits it.
                  set -euf

                  B=https://api.porkbun.com/api/json/v3
                  AUTH="\"apikey\":\"$PORKBUN_API_KEY\",\"secretapikey\":\"$PORKBUN_SECRET_API_KEY\""

                  # Porkbun authenticates by body, not header, and every call is a POST.
                  api() { curl -4 -sS -X POST -H "Content-Type: application/json" \
                               --data "{$AUTH${2:+,$2}}" "$B/$1"; }
                  ok() { echo "$1" | grep -q '"status":"SUCCESS"'; }

                  # 60s so a changed public IP propagates quickly. Porkbun's docs and
                  # several clients claim a 600s floor; the API accepts and stores 60.
                  TTL=60

                  RESP=$(api ping)
                  ok "$RESP" || { echo "porkbun ping failed: $RESP" >&2; exit 1; }
                  IP=$(echo "$RESP" | sed -n 's/.*"yourIp":"\([0-9.]*\)".*/\1/p')
                  case "$IP" in
                    *.*.*.*) ;;
                    *) echo "could not determine public IPv4 (got '$IP')" >&2; exit 1 ;;
                  esac

                  for SUB in $(echo "$RECORDS" | tr ',' ' '); do
                    if [ "$SUB" = "@" ]; then
                      NAME=""; FQDN="$ZONE"
                    else
                      NAME="$SUB"; FQDN="$SUB.$ZONE"
                    fi

                    RESP=$(api "dns/retrieveByNameType/$ZONE/A/$NAME")
                    ok "$RESP" || { echo "lookup failed for $FQDN: $RESP" >&2; exit 1; }
                    CUR=$(echo "$RESP" | sed -n 's/.*"content":"\([0-9.]*\)".*/\1/p' | head -1)

                    if [ -z "$CUR" ]; then
                      echo "creating $FQDN -> $IP"
                      RESP=$(api "dns/create/$ZONE" \
                        "\"name\":\"$NAME\",\"type\":\"A\",\"content\":\"$IP\",\"ttl\":\"$TTL\"")
                    elif [ "$CUR" != "$IP" ]; then
                      echo "updating $FQDN: $CUR -> $IP"
                      RESP=$(api "dns/editByNameType/$ZONE/A/$NAME" \
                        "\"content\":\"$IP\",\"ttl\":\"$TTL\"")
                    else
                      echo "$FQDN already $IP"
                      continue
                    fi
                    ok "$RESP" || { echo "write failed for $FQDN: $RESP" >&2; exit 1; }
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
