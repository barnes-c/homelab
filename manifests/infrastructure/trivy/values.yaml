operator:
  # Scan jobs pull whole images; more than a few at once saturates a Pi.
  scanJobsConcurrentLimit: 2
  scanJobTimeout: 10m
  # node-collector mounts kubeadm host paths Talos doesn't have, and its hostPath volumes
  # would need a privileged namespace.
  infraAssessmentScannerEnabled: false
  # One server keeps the vulnerability DB on a PVC instead of every scan job downloading it.
  builtInTrivyServer: true

service:
  annotations:
    prometheus.io/scrape: "true"

trivyOperator:
  # The trivy image runs as root; scan jobs only read images and write to emptyDirs.
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

trivy:
  storageClassName: longhorn
  timeout: 10m0s
  server:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

compliance:
  # k8s-cis-1.23 is built from node-collector reports, which are disabled above.
  specs:
    - k8s-nsa-1.0
    - k8s-pss-baseline-0.1
    - k8s-pss-restricted-0.1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
