# Read-only cluster access for coding agents. Built on `view`, which excludes Secrets; the extra
# ClusterRole adds the cluster-scoped and CRD reads `view` leaves out. Never grant `secrets` here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude
  namespace: agent-access
automountServiceAccountToken: false
---
# Long-lived token; deleting this Secret revokes it, Argo recreates it with a fresh one.
apiVersion: v1
kind: Secret
metadata:
  name: claude-token
  namespace: agent-access
  annotations:
    kubernetes.io/service-account.name: claude
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - rbac.authorization.k8s.io
      - storage.k8s.io
      - argoproj.io
      - aquasecurity.github.io
      - bitnami.com
      - cert-manager.io
      - acme.cert-manager.io
      - cilium.io
      - external-secrets.io
      - gateway.networking.k8s.io
      - longhorn.io
      - snapshot.storage.k8s.io
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: claude
    namespace: agent-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readonly
subjects:
  - kind: ServiceAccount
    name: claude
    namespace: agent-access
