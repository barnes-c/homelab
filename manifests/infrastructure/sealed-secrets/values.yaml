fullnameOverride: sealed-secrets-controller
# No automatic key renewal, so one off-cluster backup of the keys stays complete.
# Renewal never re-encrypts existing SealedSecrets anyway. See #32.
keyrenewperiod: "0"
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
