# Pods in these namespaces never talk to the Kubernetes API, so their ServiceAccounts don't
# mount a token. This mutates the ServiceAccount, not the pod: the ServiceAccount plugin adds
# the token volume before mutating admission policies see the pod, so a pod-level false comes
# too late. ServiceAccounts that set the field explicitly are left alone.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: no-service-account-token
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [serviceaccounts]
  matchConditions:
    - name: unset
      expression: "!has(object.automountServiceAccountToken)"
  # Hardening only: if the policy errors, create the ServiceAccount unchanged rather than not at all.
  failurePolicy: Ignore
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: "Object{automountServiceAccountToken: false}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: no-service-account-token
spec:
  policyName: no-service-account-token
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [asurascans, authentik, barnes-biz, blog-barnes-biz, immich]
