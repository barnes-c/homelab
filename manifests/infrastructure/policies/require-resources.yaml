# Every container needs a memory limit and a CPU request. CREATE only, so pods that predate the
# policy can still be updated and deleted.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-resources
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: missing
      expression: >-
        variables.containers.filter(c, !(
          has(c.resources) &&
          has(c.resources.limits) && 'memory' in c.resources.limits &&
          has(c.resources.requests) && 'cpu' in c.resources.requests
        )).map(c, c.name)
  validations:
    - expression: size(variables.missing) == 0
      messageExpression: >-
        'every container needs a memory limit and a CPU request, missing on: ' +
        variables.missing.join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: require-resources
spec:
  policyName: require-resources
  validationActions: [Deny]
  matchResources:
    # Exclude cluster critical namespaces from this policy.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, longhorn-system]
