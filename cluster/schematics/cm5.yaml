# Raspberry Pi CM5 8GB on NanoCluster, eMMC boot
---
overlay:
  name: rpi_5
  image: siderolabs/sbc-raspberrypi
  options:
    # The board's fan switch (Q9900, on the header's "-") is faulty, so the Noctua's PWM wire
    # goes straight to UART header pin 1 (slot-1 TX = GPIO14) through 1 kOhm; slot 1 drives it.
    configTxtAppend: |
      dtoverlay=disable-bt
      dtoverlay=disable-wifi
      dtoverlay=pwm-gpio-fan
      dtparam=fan_gpio=14
      dtparam=fan_temp0=10000
      dtparam=fan_temp0_speed=102
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      - siderolabs/util-linux-tools
