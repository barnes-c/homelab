# Raspberry Pi CM5 8GB on NanoCluster, eMMC boot
---
overlay:
  name: rpi_5
  image: siderolabs/sbc-raspberrypi
  options:
    # The board's fan switch (Q9900, header "-") is faulty, so the Noctua's PWM wire goes
    # straight to UART header pin 1 (slot-1 TX = GPIO14), driven by slot 1. Not inverted;
    # fan_temp0 below any real SoC temperature keeps a 40% floor.
    # One dtparam per line: the firmware truncates long config.txt lines.
    # See barnes-c/homelab-issues#76.
    configTxtAppend: |
      dtoverlay=disable-bt
      dtoverlay=disable-wifi
      dtoverlay=pwm-gpio-fan
      dtparam=fan_gpio=14
      dtparam=fan_temp0=10000
      dtparam=fan_temp0_speed=102
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      - siderolabs/util-linux-tools
