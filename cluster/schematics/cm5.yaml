# Raspberry Pi CM5 8GB on NanoCluster, eMMC boot
---
overlay:
  name: rpi_5
  image: siderolabs/sbc-raspberrypi
  options:
    # The NanoCluster fan's PWM line is pulled low by a MOSFET driven from slot 1's GPIO13
    # (sipeed/NanoCluster#13), so duty is inverted: 0 = full speed. pwm-gpio-fan cannot set
    # polarity, so the speeds below are 255 minus the wanted speed, and fan_temp0 is set
    # below any real SoC temperature to keep state 0 (always full speed) unreachable.
    # Speeds: 40% baseline, 60% at 60 C, 80% at 67.5 C, 100% at 75 C.
    # One dtparam per line: the firmware truncates long config.txt lines, which silently
    # dropped the speed overrides when they were all on the dtoverlay line.
    configTxtAppend: |
      dtoverlay=disable-bt
      dtoverlay=disable-wifi
      dtoverlay=pwm-gpio-fan
      dtparam=fan_gpio=13
      dtparam=fan_temp0=10000
      dtparam=fan_temp0_speed=153
      dtparam=fan_temp1_speed=102
      dtparam=fan_temp2_speed=51
      dtparam=fan_temp3_speed=0
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      - siderolabs/util-linux-tools
