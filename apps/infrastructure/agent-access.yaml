apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/barnes-c/homelab
    targetRevision: master
    path: manifests/infrastructure/agent-access
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
