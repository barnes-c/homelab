apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://github.com/barnes-c/homelab
      targetRevision: master
      path: manifests/infrastructure/dns
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: blocky
        valueFiles:
          - $values/manifests/infrastructure/dns/blocky/values.yaml
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: unbound
        valueFiles:
          - $values/manifests/infrastructure/dns/unbound/values.yaml
    - repoURL: ghcr.io/k8s-gateway/charts
      chart: k8s-gateway
      targetRevision: 3.7.2
      helm:
        releaseName: k8s-gateway
        valueFiles:
          - $values/manifests/infrastructure/dns/k8s-gateway/values.yaml
    - repoURL: https://github.com/barnes-c/homelab
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
