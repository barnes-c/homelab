apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipHealthCheck
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.1
    helm:
      values: |
        defaultSettings:
          # Matches the UserVolumeConfig named "longhorn" in tofu/talos; Talos mounts
          # user volumes at /var/mnt/<name>.
          defaultDataPath: /var/mnt/longhorn
          defaultReplicaCount: "1"
          replicaAutoBalance: disabled
          # Only nodes labelled node.longhorn.io/create-default-disk=true get a disk.
          # Without this Longhorn creates one at defaultDataPath on EVERY node, and on a
          # worker whose only storage is an SD card it would silently create that
          # directory and start writing replicas to it. Labels are set per node in
          # tofu/talos/variables.tf (node_labels).
          createDefaultDiskLabeledNodes: "true"
        preUpgradeChecker:
          jobEnabled: false
        longhornManager:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        longhornUI:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        longhornDriver:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        csi:
          attacher:
            replicas: 1
          provisioner:
            replicas: 1
          resizer:
            replicas: 1
          snapshotter:
            replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/preserveUnknownFields
