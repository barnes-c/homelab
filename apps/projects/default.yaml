apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Bootstrap only; holds apps-root, which manages Applications and AppProjects.
  sourceRepos:
    - https://github.com/barnes-c/homelab
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  # Explicitly empty
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
