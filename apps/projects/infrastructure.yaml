apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Shared cluster services other apps depend on.
  sourceRepos:
    - https://github.com/barnes-c/homelab
    - https://argoproj.github.io/argo-helm
    - https://bitnami.github.io/sealed-secrets
    - https://charts.external-secrets.io
    - https://charts.goauthentik.io
    - https://charts.jetstack.io
    - https://charts.longhorn.io
    - https://fluent.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://piraeus.io/helm-charts
    - https://postfinance.github.io/kubelet-csr-approver
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
