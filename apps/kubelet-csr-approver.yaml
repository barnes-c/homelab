apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-csr-approver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://postfinance.github.io/kubelet-csr-approver
      chart: kubelet-csr-approver
      targetRevision: 1.2.15
      helm:
        valueFiles:
          - $values/manifests/kubelet-csr-approver/kubelet-csr-approver/values.yaml
    - repoURL: https://github.com/barnes-c/homelab
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelet-csr-approver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
