apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barnes-biz
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/barnes-c/homelab
    path: manifests/workloads/barnes-biz
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: barnes-biz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
